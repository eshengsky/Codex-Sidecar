<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="180" y1="96" x2="852" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#FAF7F3"/>
      <stop offset="1" stop-color="#F2EEE9"/>
    </linearGradient>

    <radialGradient id="bgGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(302 224) rotate(47) scale(700 780)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.54" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D8D1C9" stop-opacity="0.12"/>
    </radialGradient>

    <linearGradient id="ink" x1="214" y1="184" x2="824" y2="830" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172027"/>
      <stop offset="1" stop-color="#253038"/>
    </linearGradient>

    <filter id="outerShadow" x="30" y="28" width="964" height="956" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <filter id="softInset" x="60" y="60" width="904" height="904" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dx="0" dy="-2"/>
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="blur" in2="SourceAlpha" operator="out" result="shadowDiff"/>
      <feColorMatrix in="shadowDiff" type="matrix" values="0 0 0 0 0.52 0 0 0 0 0.48 0 0 0 0 0.43 0 0 0 0.16 0"/>
      <feBlend in2="SourceGraphic" mode="multiply"/>
    </filter>

    <filter id="strokeShadow" x="120" y="120" width="780" height="780" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- macOS-style rounded app tile -->
  <rect x="64" y="54" width="896" height="896" rx="210" fill="url(#bg)" filter="url(#outerShadow)"/>
  <rect x="64" y="54" width="896" height="896" rx="210" fill="url(#bgGlow)" filter="url(#softInset)"/>
  <rect x="82" y="72" width="860" height="860" rx="194" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="3"/>

  <!-- terminal window outline -->
  <g filter="url(#strokeShadow)">
    <path d="M300 176H716C788.9 176 848 235.1 848 308V716C848 788.9 788.9 848 716 848H300C227.1 848 168 788.9 168 716V308C168 235.1 227.1 176 300 176Z"
          stroke="url(#ink)" stroke-width="34" stroke-linejoin="round"/>

    <!-- prompt symbol -->
    <path d="M322 410L474 512L322 614" stroke="url(#ink)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M526 626H646" stroke="url(#ink)" stroke-width="34" stroke-linecap="round"/>

    <!-- right status rail -->
    <rect x="704" y="284" width="146" height="562" rx="58" fill="#FFFDFC"/>
    <rect x="704" y="284" width="146" height="562" rx="58" stroke="url(#ink)" stroke-width="28"/>

    <circle cx="777" cy="392" r="16" fill="#16A9E8"/>
    <circle cx="777" cy="488" r="16" fill="#FFC400"/>
    <circle cx="777" cy="584" r="16" fill="#13D36B"/>
    <circle cx="777" cy="680" r="16" fill="#FF524A"/>
  </g>
</svg>
